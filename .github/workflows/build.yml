name: Armar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CanalesTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publica el APK con un link fijo para bajarlo desde la tele con la app "Downloader":
      # https://github.com/<usuario>/<repo>/releases/download/ultima/CanalesTV.apk
      - name: Copiar con nombre fijo
        run: cp app/build/outputs/apk/debug/app-debug.apk CanalesTV.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Última versión
          prerelease: true
          files: CanalesTV.apk
