name: Armar APK Listas M3U

on:
  push:
    paths:
      - 'listas-m3u/**'
      - '.github/workflows/listas-m3u.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listas-m3u
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Copiar con nombre fijo
        run: cp app/build/outputs/apk/debug/app-debug.apk ListasM3U.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ListasM3U-apk
          path: listas-m3u/ListasM3U.apk

      # Link fijo para bajarlo desde la tele con la app "Downloader":
      # https://github.com/<usuario>/<repo>/releases/download/listas-ultima/ListasM3U.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: listas-ultima
          name: Listas M3U (última versión)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: listas-m3u/ListasM3U.apk
